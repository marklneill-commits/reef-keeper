<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07141a"><title>Reef Keeper</title><style>body{margin:0;background:#07141a;color:#eef9fb;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:28px 16px 60px}h1{margin:0 0 5px;font-size:28px}.sub{color:#9db5bc;line-height:1.45}.card{background:#0d2028;border:1px solid #23424b;border-radius:18px;padding:17px;margin:12px 0}.version{display:flex;align-items:center;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:700}.meta{color:#9db5bc;font-size:12px;margin-top:4px}a.button{display:inline-block;background:#5de1d0;color:#052027;text-decoration:none;border-radius:12px;padding:10px 13px;font-weight:700;white-space:nowrap}.muted{color:#9db5bc;font-size:13px}.error{color:#ffb4b4}</style></head><body><main><h1>🪸 Reef Keeper</h1><div class="sub">Choose a saved version of the app. This page reads the HTML versions directly from the GitHub repository, so new versions can appear here without replacing this launcher.</div><div id="versions"><div class="card muted">Loading versions…</div></div></main><script>const repo='marklneill-commits/reef-keeper';const fallback=[['reefkeeper-v2.html','Reef Keeper V2','Coral Library + frag photography'],['reefkeeper-v1.html','Reef Keeper V1','Coral Library foundation']];function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(files){const html=files.filter(f=>/^reefkeeper-v\d+\.html$/i.test(f.name)).sort((a,b)=>b.name.localeCompare(a.name,undefined,{numeric:true})).map(f=>{const m=f.name.match(/v(\d+)/i);return `<div class="card"><div class="version"><div><div class="name">${esc('Reef Keeper V'+m[1])}</div><div class="meta">${esc(f.name)}</div></div><a class="button" href="${esc('./'+f.name)}">Open →</a></div></div>`}).join('');document.getElementById('versions').innerHTML=html||'<div class="card error">No version files found.</div>'}async function load(){try{const r=await fetch('https://api.github.com/repos/'+repo+'/contents/');if(!r.ok)throw new Error('GitHub API unavailable');const files=await r.json();render(files)}catch(e){render(fallback.map(x=>({name:x[0]})));document.getElementById('versions').insertAdjacentHTML('beforeend','<div class="card muted">Repository listing could not be loaded automatically, so the known versions are shown instead.</div>')}}load();</script></body></html>
